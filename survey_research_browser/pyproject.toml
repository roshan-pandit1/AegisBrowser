[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "survey-research-browser"
version = "0.1.0"
description = "Authorized synthetic survey testing with Chromium"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6>=6.10,<7", "playwright>=1.56,<2", "SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.16", "ruff>=0.12"]
[project.scripts]
survey-browser = "survey_browser.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["browser: requires installed Playwright Chromium and loopback sockets", "gui: requires Qt platform support"]
[tool.ruff]
target-version = "py312"
line-length = 100
