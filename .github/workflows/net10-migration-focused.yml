name: .NET 10 migration focused gates
on:
  push:
    branches: ['ci/net10-preflight-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Record exact source and SDK
        run: |
          git rev-parse HEAD
          if ((dotnet --version) -cne '10.0.404') { throw 'Unexpected SDK version.' }
          dotnet --info
      - name: Gate 1 - restore each active project
        run: |
          foreach ($project in @('AegisBrowser.Core', 'AegisBrowser', 'AegisBrowser.Tests', 'AegisBrowser.BrowserTests', 'AegisBrowser.FilteringTests')) {
            dotnet restore "$project/$project.csproj" -r win-x64 -p:SelfContained=true
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
          }
      - name: Gate 2 - compile each active project
        run: |
          foreach ($project in @('AegisBrowser.Core', 'AegisBrowser', 'AegisBrowser.Tests', 'AegisBrowser.BrowserTests', 'AegisBrowser.FilteringTests')) {
            dotnet build "$project/$project.csproj" -c Release -r win-x64 -p:SelfContained=true --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }
      - name: Gate 3 - core privacy profile and proxy-guard tests
        run: |
          dotnet run --project AegisBrowser.Tests -c Release -r win-x64 -p:SelfContained=true --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Gate 4 - native browser profile persistence
        timeout-minutes: 5
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('aegis-net10-profile-' + [guid]::NewGuid().ToString('N'))
          foreach ($phase in @('write', 'read')) {
            $output = & ./AegisBrowser.BrowserTests/bin/Release/net10.0-windows/win-x64/AegisBrowser.BrowserTests.exe $phase $root 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or ($output -join "`n") -notmatch "PASS: \d+ browser integration checks \($phase\)" -or
                ($output -join "`n") -notmatch "PASS: CEF shutdown completed \($phase\)") { throw "Browser profile phase failed: $phase" }
          }
      - name: Gate 5 - native viewport restart and shutdown
        timeout-minutes: 5
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('aegis-net10-viewport-' + [guid]::NewGuid().ToString('N'))
          foreach ($phase in @('viewport-write', 'viewport-read')) {
            $output = & ./AegisBrowser.BrowserTests/bin/Release/net10.0-windows/win-x64/AegisBrowser.BrowserTests.exe $phase $root 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or ($output -join "`n") -match 'Check failed:' -or
                ($output -join "`n") -notmatch "PASS: \d+ CSS viewport checks \($phase\)" -or
                ($output -join "`n") -notmatch "PASS: viewport CEF shutdown completed \($phase\)" -or
                ($output -join "`n") -notmatch 'P4FP07_CSS_BUCKET: VERIFIED zoom_1' -or
                ($output -join "`n") -notmatch 'P4FP08_ROUNDING: VERIFIED zoom_minus_1') { throw "Viewport phase failed: $phase" }
          }
          $root = Join-Path $env:RUNNER_TEMP ('aegis-net10-window-' + [guid]::NewGuid().ToString('N'))
          $output = & ./AegisBrowser.BrowserTests/bin/Release/net10.0-windows/win-x64/AegisBrowser.BrowserTests.exe hwnd-repro $root 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0 -or ($output -join "`n") -match 'Check failed:' -or
              ($output -join "`n") -notmatch 'PASS: native window candidate reproduction completed and CEF shut down') { throw 'Native window lifecycle failed.' }
      - name: Gate 6 - publish x64 self-contained payload
        run: |
          dotnet publish AegisBrowser/AegisBrowser.csproj -c Release -r win-x64 -p:SelfContained=true --no-build --no-restore -o ./artifacts/net10-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained publish failed.' }
          ./tests/acceptance/verify-published-runtime.ps1 -PublishDirectory ./artifacts/net10-preflight -ExpectedRuntimeVersion '10.0.15'
