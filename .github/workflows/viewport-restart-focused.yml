name: Focused native viewport restart
on:
  push:
    branches: ['ci/viewport-focused-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization-required:
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Refuse unaudited workflow execution
        run: exit 1
  viewport-restart:
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Record SDK and candidate revision
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
      - name: Build native browser fixture
        run: dotnet build AegisBrowser.BrowserTests -c Release -r win-x64 -p:SelfContained=true
      - name: Run core regression checks
        run: dotnet run --project AegisBrowser.Tests -c Release --runtime win-x64 -p:PlatformTarget=x64
      - name: Run real CEF viewport write and restart phases
        timeout-minutes: 5
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP ('aegis-viewport-focused-' + [guid]::NewGuid().ToString('N'))
          foreach ($phase in @('viewport-write', 'viewport-read')) {
            $output = & ./AegisBrowser.BrowserTests/bin/Release/net10.0-windows/win-x64/AegisBrowser.BrowserTests.exe $phase $profileRoot 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or ($output -join "`n") -match 'Check failed:' -or
                ($output -join "`n") -notmatch "PASS: \d+ CSS viewport checks \($phase\)" -or
                ($output -join "`n") -notmatch "PASS: viewport CEF shutdown completed \($phase\)" -or
                ($output -join "`n") -notmatch 'P4LB_CSS_VIEWPORT:' -or
                ($output -join "`n") -notmatch 'P4FP07_CSS_BUCKET: VERIFIED zoom_1' -or
                ($output -join "`n") -notmatch 'P4FP08_ROUNDING: VERIFIED zoom_minus_1') {
              foreach ($line in $output) {
                if ("$line" -match 'FAIL:|TimeoutException:|P4LB_ZOOM_ASSERTION:') { Write-Output "::error::$line" }
              }
              throw "CSS viewport probe $phase failed or did not complete native shutdown."
            }
          }
