name: Experimental native framework and sandbox qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/p3-09f-sandbox-native-qualification

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  qualification:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            6.0.428
            8.0.427
      - name: Test metadata and sandbox input rejection
        run: |
          ./tests/research/p309f/test-framework-metadata.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Framework metadata checks failed.' }
          ./tests/research/p309f/test-sandbox-preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox preflight checks failed.' }
          ./tests/research/p309f/test-run-result.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native result classification checks failed.' }
      - name: Build pinned unmodified CefSharp baseline
        id: baseline
        timeout-minutes: 25
        run: ./tests/research/p309e-native-baseline.ps1
      - name: Check source-built assembly references
        env:
          P309F_RUNTIME: ${{ steps.baseline.outputs.runtime_path }}
        run: |
          if (-not $env:P309F_RUNTIME) { throw 'Native build did not report an output path.' }
          dotnet ./tests/research/p309f/FrameworkMetadata/bin/Release/net8.0/FrameworkMetadata.dll $env:P309F_RUNTIME 6
          if ($LASTEXITCODE -ne 0) { throw 'Native assembly references exceed the .NET 6 metadata gate.' }
          Write-Host 'SANDBOX_ENFORCEMENT: NOT_RUN'
          Write-Host 'NATIVE_CEF_STARTUP: NOT_RUN'
          Write-Host 'OWNER_RELEASE_CONTRACT: UNSATISFIED'
      - name: Compare standalone C++ CLI framework references
        timeout-minutes: 5
        env:
          P309F_RUNTIME: ${{ steps.baseline.outputs.runtime_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:P309F_RUNTIME -or -not (Test-Path -LiteralPath $env:P309F_RUNTIME -PathType Leaf)) {
            throw 'The pinned baseline runtime is missing.'
          }
          $ijw = Join-Path (Split-Path -Parent $env:P309F_RUNTIME) 'Ijwhost.dll'
          if (-not (Test-Path -LiteralPath $ijw -PathType Leaf)) { throw 'The baseline IJW host is missing.' }
          $ijwVersion = (Get-Item -LiteralPath $ijw).VersionInfo.ProductVersion
          if ($ijwVersion -notmatch '^6\.0\.36(?:\s|$)') { throw "Unexpected IJW host version: $ijwVersion" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = @(& $vswhere -version '[17.0,18.0)' -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.CLI.Support -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $vs.Count -ne 1 -or -not $vs[0]) { throw 'VS 2022 C++/CLI is unavailable.' }
          $msbuild = Join-Path $vs[0] 'MSBuild/Current/Bin/MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) { throw 'MSBuild is unavailable.' }
          $dotnetRoot = Split-Path -Parent (Get-Command dotnet.exe -ErrorAction Stop).Source
          $env:DOTNET_ROOT = $dotnetRoot
          $env:MSBuildSDKsPath = Join-Path $dotnetRoot 'sdk/6.0.428/Sdks'
          if (-not (Test-Path -LiteralPath $env:MSBuildSDKsPath -PathType Container)) { throw 'Pinned .NET 6 SDK is unavailable.' }
          $ijwLib = Join-Path $dotnetRoot 'packs/Microsoft.NETCore.App.Host.win-x64/6.0.36/runtimes/win-x64/native'
          if (-not (Test-Path -LiteralPath (Join-Path $ijwLib 'ijwhost.lib') -PathType Leaf)) { throw 'Pinned x64 IJW import library is unavailable.' }
          $env:MSBuildEnableWorkloadResolver = 'false'
          $root = Join-Path $env:RUNNER_TEMP ('aegis-p309f-compiler-' + [Guid]::NewGuid().ToString('N'))
          $out = (Join-Path $root 'out') + '\'
          $obj = (Join-Path $root 'obj') + '\'
          New-Item -ItemType Directory -Path $out, $obj -ErrorAction Stop | Out-Null
          $project = (Resolve-Path ./tests/research/p309f/CompilerProbe/CompilerProbe.vcxproj).Path
          & $msbuild $project /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:VisualStudioVersion=17.0 /p:RuntimeIdentifier=win-x64 "/p:IjwHostSourcePath=$ijw" "/p:P309fIjwLibraryDirectory=$ijwLib" "/p:OutDir=$out" "/p:IntDir=$obj" /m:1 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "Standalone C++/CLI probe build failed: $LASTEXITCODE" }
          $assembly = Join-Path $out 'CompilerProbe.dll'
          if (-not (Test-Path -LiteralPath $assembly -PathType Leaf)) { throw 'Standalone C++/CLI probe output is missing.' }
          dotnet ./tests/research/p309f/FrameworkMetadata/bin/Release/net8.0/FrameworkMetadata.dll $assembly 6
          if ($LASTEXITCODE -ne 0) { throw 'Standalone C++/CLI probe references exceed the .NET 6 metadata gate.' }
          Write-Host 'STANDALONE_COMPILER_PROBE: PASS (metadata only; ABI and runtime not verified)'
      - name: Compile sandbox-requesting native research client
        timeout-minutes: 5
        env:
          P309F_CEF_SDK: ${{ steps.baseline.outputs.sdk_path }}
        run: |
          if (-not $env:P309F_CEF_SDK -or -not (Test-Path -LiteralPath $env:P309F_CEF_SDK -PathType Container)) { throw 'Pinned CEF SDK directory is missing.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = @(& $vswhere -version '[17.0,18.0)' -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.CLI.Support -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $vs.Count -ne 1 -or -not $vs[0]) { throw 'VS 2022 C++ toolchain is unavailable.' }
          $msbuild = Join-Path $vs[0] 'MSBuild/Current/Bin/MSBuild.exe'
          $root = Join-Path $env:RUNNER_TEMP ('aegis-p309f-native-' + [Guid]::NewGuid().ToString('N'))
          $out = (Join-Path $root 'out') + '\'
          $obj = (Join-Path $root 'obj') + '\'
          New-Item -ItemType Directory -Path $out, $obj -ErrorAction Stop | Out-Null
          & $msbuild ./tests/research/p309f/NativeHarness/NativeHarness.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:CefSdkRoot=$env:P309F_CEF_SDK" "/p:OutDir=$out" "/p:IntDir=$obj" /m:1 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "Native research client build failed: $LASTEXITCODE" }
          $client = Join-Path $out 'p309f_client.dll'
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) { throw 'Native research client output is missing.' }
          Write-Host ("NATIVE_CLIENT_SHA256={0}" -f (Get-FileHash -LiteralPath $client -Algorithm SHA256).Hash)
          Write-Host 'NATIVE_CLIENT_BUILD: PASS (compile/link only; CEF execution NOT_RUN)'
