name: Windows build and release artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Record SDK and source revision
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
      - name: Restore Windows x64 application
        run: dotnet restore AegisBrowser/AegisBrowser.csproj -r win-x64 -p:SelfContained=true
      - name: Build Windows x64 Release
        run: dotnet build AegisBrowser/AegisBrowser.csproj -c Release -r win-x64 -p:SelfContained=true --no-restore
      - name: Restore Windows x64 automated tests
        run: dotnet restore AegisBrowser.Tests/AegisBrowser.Tests.csproj -r win-x64
      - name: Run Windows x64 automated tests
        run: dotnet run --project AegisBrowser.Tests -c Release --runtime win-x64 -p:PlatformTarget=x64 --no-restore
      - name: Build browser integration tests
        run: dotnet build AegisBrowser.BrowserTests -c Release -r win-x64 -p:SelfContained=true
      - name: Browser storage, OAuth, tab and renderer tests
        timeout-minutes: 5
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP ('aegis-browser-tests-' + [guid]::NewGuid().ToString('N'))
          # Reopen the same persistent profiles repeatedly to expose close races.
          foreach ($phase in @('write', 'read', 'read', 'read')) {
            $output = & ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe $phase $profileRoot 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if (($output -join "`n") -match 'Check failed:') { throw "Native Chromium assertion detected" }
            if ($code -ne 0) { throw "Browser $phase phase exited with $code" }
            if (!(($output -join "`n") -match "PASS: \d+ browser integration checks \($phase\)")) {
              throw "Browser $phase phase did not report suite completion"
            }
            if (!(($output -join "`n") -match "PASS: CEF shutdown completed \($phase\)")) {
              throw "Browser $phase phase did not complete CEF shutdown"
            }
          }
      - name: Controlled CEF proxy routing and bypass probe
        timeout-minutes: 3
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP ('aegis-proxy-probe-' + [guid]::NewGuid().ToString('N'))
          $output = & ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe proxy-probe $profileRoot 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if (($output -join "`n") -match 'Check failed:') { throw 'Native Chromium assertion detected' }
          if ($code -ne 0 -or !(($output -join "`n") -match 'PASS: \d+ CEF proxy probe checks')) { throw 'CEF proxy probe failed or incomplete' }
          if (!(($output -join "`n") -match 'PASS: CEF proxy probe shutdown completed')) { throw 'CEF proxy probe did not complete native shutdown' }
      - name: Controlled CEF proxy authentication probe
        timeout-minutes: 3
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP ('aegis-proxy-auth-probe-' + [guid]::NewGuid().ToString('N'))
          $output = & ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe proxy-auth-probe $profileRoot 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if (($output -join "`n") -match 'Check failed:') { throw 'Native Chromium assertion detected' }
          if ($code -ne 0 -or !(($output -join "`n") -match 'PASS: \d+ CEF proxy authentication probe checks')) { throw 'CEF proxy authentication probe failed or incomplete' }
          if (!(($output -join "`n") -match 'PASS: CEF proxy authentication probe shutdown completed')) { throw 'CEF authentication probe did not complete native shutdown' }
      - name: Concurrent independent CEF proxy probes
        timeout-minutes: 5
        run: ./tests/acceptance/concurrent-proxy-probes.ps1 -BrowserTestsExe ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe
      - name: Observe synthetic CEF process identities
        timeout-minutes: 5
        run: ./tests/acceptance/observe-cef-process-identity.ps1 -BrowserTestsExe ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe
      - name: Build Chromium filtering tests
        if: ${{ !cancelled() }}
        run: dotnet build AegisBrowser.FilteringTests -c Release -r win-x64 -p:SelfContained=true
      - name: Run Chromium filtering tests
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $output = & ./AegisBrowser.FilteringTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.FilteringTests.exe 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if (($output -join "`n") -match 'Check failed:') { throw "Native Chromium assertion detected" }
          if ($code -ne 0) { throw "Chromium filtering tests exited with $code" }
          if (!(($output -join "`n") -match 'PASS: \d+ Chromium filtering checks')) { throw 'Chromium filtering suite did not complete' }
      - name: Browser privacy settings process restart
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP ('aegis-settings-' + [guid]::NewGuid().ToString('N'))
          foreach ($phase in @('write', 'read')) {
            $output = & ./AegisBrowser.FilteringTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.FilteringTests.exe $phase $profileRoot 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if (($output -join "`n") -match 'Check failed:') { throw "Native Chromium assertion detected" }
            if ($code -ne 0 -or !(($output -join "`n") -match 'PASS: \d+ Chromium filtering checks')) { throw "Privacy restart $phase failed or incomplete" }
          }
      - name: Publish self-contained Windows x64 build
        run: dotnet publish AegisBrowser/AegisBrowser.csproj -c Release -r win-x64 --self-contained true --no-build --no-restore -o artifacts/win-x64
      - name: Check release payload
        run: |
          foreach ($file in @('AegisBrowser.exe', 'CefSharp.BrowserSubprocess.exe', 'libcef.dll', 'coreclr.dll')) {
            if (!(Get-ChildItem artifacts/win-x64 -Recurse -Filter $file)) { throw "Missing $file" }
          }
      - name: Dashboard launches and reopens published browser
        timeout-minutes: 3
        run: |
          $output = & ./AegisBrowser.BrowserTests/bin/Release/net8.0-windows/win-x64/AegisBrowser.BrowserTests.exe dashboard-launch ./artifacts/win-x64/AegisBrowser.exe 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if (($output -join "`n") -match 'Check failed:') { throw 'Native Chromium assertion detected' }
          if ($code -ne 0 -or !(($output -join "`n") -match 'PASS: \d+ dashboard application checks')) { throw 'Dashboard application launch test failed or incomplete' }
      - name: Smoke test published Windows application
        run: ./tests/acceptance/windows-smoke.ps1 -PublishDirectory artifacts/win-x64
      - name: Upload complete publish directory
        uses: actions/upload-artifact@v4
        with:
          name: AegisBrowser-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Package and verify portable ZIP
        run: ./scripts/package-portable.ps1
      - name: Upload portable release candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AegisBrowser-portable-win-x64
          path: artifacts/portable/
          if-no-files-found: error
