name: Experimental pinned CefSharp native baseline

on:
  workflow_dispatch:
  push:
    branches:
      - research/p3-09e-native-popup-bridge

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify offline source-audit failure handling
        run: ./tests/research/p309e/test-source-audit.ps1
      - name: Install isolated .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            6.0.428
            8.0.427
      - name: Restore and build unmodified native baseline
        timeout-minutes: 25
        run: ./tests/research/p309e-native-baseline.ps1
